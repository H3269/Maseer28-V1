<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#102A43" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./app-icon-192.png" />
<link rel="preload" as="image" href="./assets/splash-logo.webp" type="image/webp" fetchpriority="high" />
<title>مسیر ۲۸ روزه بازسازی ذهن</title>
<style>
html,body{margin:0;min-height:100%;width:100%;background:#F5F8FC}#root{width:100%;min-height:100vh;min-height:100svh;margin:0;padding:0;}
.initialSplash{position:fixed;inset:0;width:100%;height:100vh;height:100svh;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,rgba(64,224,208,.13) 0%,rgba(255,255,255,.98) 34%,#F5F8FC 72%,#EAF3FA 100%);color:#102A43;font-family:Tahoma,sans-serif}
.initialSplashInner{display:flex;flex-direction:column;align-items:center;gap:13px;width:100%;text-align:center;opacity:1;clip-path:none;animation:none;transform-origin:center}
.initialSplash img{display:block;width:174px;height:174px;max-width:70vw;object-fit:contain;border:0!important;outline:0!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important;opacity:1;visibility:visible;clip-path:circle(0% at 50% 50%);transform:scale(.96);animation:loadingLogoBloom 950ms cubic-bezier(.2,.72,.2,1) both}
.initialSplash h1,.initialSplash p{opacity:1;transform:none;animation:none}.initialSplash h1{margin:5px 0 0;font-size:20px}.initialSplash p{margin:0;color:#5B7187;font-size:13px}.initialProgress{opacity:1;transform:none;animation:none}
.initialProgress{display:block;width:min(220px,70vw);height:8px;margin-top:3px;overflow:hidden;border:1px solid #C7E5E8;border-radius:5px;background:#E6F7F8;box-sizing:border-box}.initialProgress span{display:block;width:100%;height:100%;border-radius:4px;background:linear-gradient(90deg,#40E0D0 0%,#4096C8 100%);transform:scaleX(0);transform-origin:right;animation:loadingProgressFill 950ms linear both}
@keyframes loadingLogoBloom{from{opacity:1;clip-path:circle(0% at 50% 50%);transform:scale(.96)}to{opacity:1;clip-path:circle(75% at 50% 50%);transform:scale(1)}}@keyframes loadingProgressFill{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.initialSplashInner,.initialSplash img,.initialSplash h1,.initialSplash p,.initialProgress{animation:none;opacity:1;transform:none;clip-path:none}.initialProgress span{animation:none;opacity:1;transform:scaleX(1);clip-path:none}}
</style>
<script>window.__PATH28_SPLASH_STARTED_AT__ = performance.now();</script>
</head>
<body>
<div id="root"><div class="initialSplash" role="status" aria-live="polite"><div class="initialSplashInner"><img src="./assets/splash-logo.webp" alt="لوگوی برنامه مسیر" width="174" height="174" fetchpriority="high" decoding="async" /><h1>مسیر ۲۸ روزه بازسازی ذهن</h1><p>در حال آماده‌سازی مسیر تو…</p><div class="initialProgress" role="progressbar" aria-label="پیشرفت نمایش لوگو" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div></div></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
