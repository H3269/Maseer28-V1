<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#28555b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./app-icon-192.png" />
<title>مسیر ۲۸ روزه بازسازی ذهن</title>
<style>
html,body{margin:0;min-height:100%;width:100%;background:#E9EEE6}#root{width:100%;min-height:100svh;margin:0;padding:0;}
.initialSplash{position:fixed;inset:0;width:100%;height:100svh;min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;background:radial-gradient(circle at 50% 42%,#F8F7F0 0%,#E9EEE6 72%,#DFE8E0 100%);color:#31584D;font-family:Tahoma,sans-serif}
.initialSplashInner{display:flex;flex-direction:column;align-items:center;gap:13px;width:100%;text-align:center;opacity:0;clip-path:ellipse(0% 0% at 50% 50%);animation:initialBloomReveal 1.7s cubic-bezier(.2,.72,.2,1) both;transform-origin:center}
.initialSplash img{width:174px;height:174px;object-fit:contain;border:0!important;outline:0!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important;clip-path:none!important;opacity:1;transform:none;animation:none}
.initialSplash h1,.initialSplash p{opacity:1;transform:none;animation:none}.initialSplash h1{margin:5px 0 0;font-size:20px}.initialSplash p{margin:0;color:#71817A;font-size:13px}
.initialProgress{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;width:min(220px,70vw);height:8px;margin-top:3px;overflow:visible;border:0;border-radius:0;background:transparent;box-shadow:none;box-sizing:border-box}.initialProgress span{position:relative;display:block;min-width:0;height:8px;overflow:hidden;border:1px solid #AAB9AE;border-radius:3px;background:#DCE8DD !important;box-sizing:border-box}.initialProgress span::before{content:'';position:absolute;inset:0 0 0 auto;width:0;border-radius:2px;background:#176B63 !important}
@keyframes initialBloomReveal{0%{opacity:0;clip-path:ellipse(0% 0% at 50% 50%)}100%{opacity:1;clip-path:ellipse(75% 75% at 50% 50%)}}
@media(prefers-reduced-motion:reduce){.initialSplashInner{animation:none;opacity:1;clip-path:none}.initialSplash img,.initialSplash h1,.initialSplash p,.initialProgress span{animation:none;opacity:1;transform:none;clip-path:none}.initialProgress span::before{width:0;animation:none}}
</style>
</head>
<body>
<div id="root"><div class="initialSplash" role="status" aria-live="polite"><div class="initialSplashInner"><img src="./assets/Logo m24.png" alt="لوگوی برنامه مسیر" /><h1>مسیر ۲۸ روزه بازسازی ذهن</h1><p>در حال آماده‌سازی مسیر تو…</p><div class="initialProgress" role="progressbar" aria-label="پیشرفت بارگذاری" aria-valuemin="0" aria-valuemax="100"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
