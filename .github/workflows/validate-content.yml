name: Validate main branch before release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep validation runs isolated per commit. A later push must never cancel
# the exact commit whose evidence is required by the publication gate.
concurrency:
  group: path28-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Content, assistant, regression tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Create evidence directory
        run: mkdir -p validation-evidence

      - name: Install locked dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee validation-evidence/npm-ci.log

      - name: Validate all daily content and evidence references
        id: content
        shell: bash
        run: |
          set -o pipefail
          npm run validate:content 2>&1 | tee validation-evidence/content-validation.log

      - name: Validate 34-topic assistant registry and safety boundaries
        id: topics
        shell: bash
        run: |
          set -o pipefail
          npm run validate:assistant-topics 2>&1 | tee validation-evidence/assistant-topic-validation.log

      - name: Run complete Node regression suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee validation-evidence/node-test.log

      - name: Build test application
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build -- --base=/Maseer28-V1/ 2>&1 | tee validation-evidence/test-build.log

      - name: Prepare canonical pre-optimization reader baseline for parity test
        shell: bash
        run: |
          mkdir -p dist/test-fixtures
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const baselineCommit = 'b9f2de1898c5e023e35840b0c86883546a7204d4';
          const source = execFileSync('git', [
            'show',
            `${baselineCommit}:src/features/library/readerEngine.js`,
          ], { encoding: 'utf8' });
          const baseline = source.replaceAll(
            'import.meta.env.BASE_URL',
            JSON.stringify('/Maseer28-V1/'),
          );
          if (baseline.includes('import.meta.env')) {
            throw new Error('Reader baseline contains an unresolved Vite environment reference.');
          }
          if (!baseline.includes('export function buildLegacyReaderLayout')) {
            throw new Error('Historical reader baseline does not expose the expected layout function.');
          }
          writeFileSync('dist/test-fixtures/readerEngine-baseline.js', baseline, 'utf8');
          NODE
          test -s dist/test-fixtures/readerEngine-baseline.js
          node --check dist/test-fixtures/readerEngine-baseline.js

      - name: Install pinned Playwright browser runner
        id: playwright
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --package-lock=false playwright@1.65.1 2>&1 | tee validation-evidence/playwright-install.log

      - name: Install Chromium and system dependencies
        id: chromium
        shell: bash
        run: |
          set -o pipefail
          # GitHub-hosted runner package mirrors can intermittently fail while
          # Playwright installs optional system packages. Retry the complete
          # install; preserve every attempt in the validation evidence.
          for attempt in 1 2 3; do
            echo "Chromium/dependency installation attempt ${attempt}/3"
            if npx playwright install --with-deps chromium 2>&1 | tee -a validation-evidence/chromium-install.log; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Installation failed; refreshing apt metadata before retry."
              sudo apt-get update 2>&1 | tee -a validation-evidence/chromium-install.log || true
              sleep $((attempt * 10))
            fi
          done
          echo "Chromium/system dependency installation failed after 3 attempts."
          exit 1

      - name: Start local test build
        id: preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > validation-evidence/preview-server.log 2>&1 &
          echo $! > validation-evidence/preview-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null; then
              if ! curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/test-fixtures/readerEngine-baseline.js > /dev/null; then
                echo "Reader parity baseline fixture is not reachable through the preview server."
                exit 1
              fi
              echo "Test build and reader parity baseline fixture are serving at the expected base path."
              exit 0
            fi
            sleep 2
          done
          cat validation-evidence/preview-server.log
          exit 1

      - name: Run all Chromium browser regression scripts
        id: browser
        shell: bash
        run: |
          set -o pipefail
          export PATH28_BASE_URL=http://127.0.0.1:4173/Maseer28-V1/
          for script in tests/browser/*.mjs; do
            name=$(basename "$script" .mjs)
            echo "Running $script"
            node "$script" 2>&1 | tee "validation-evidence/browser-$name.log"
          done

      - name: Write commit-bound validation report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          TOPICS_OUTCOME: ${{ steps.topics.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "# Path28 validation report"
            echo
            echo "- Repository: ${REPOSITORY}"
            echo "- Branch/ref: ${BRANCH_NAME}"
            echo "- Commit SHA: ${COMMIT_SHA}"
            echo "- Event: ${EVENT_NAME}"
            echo "- Workflow run: [${RUN_ID}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}) (attempt ${RUN_ATTEMPT})"
            echo "- npm ci: ${INSTALL_OUTCOME:-not-run}"
            echo "- Daily content validation: ${CONTENT_OUTCOME:-not-run}"
            echo "- 34-topic and assistant safety validation: ${TOPICS_OUTCOME:-not-run}"
            echo "- Node regression suite: ${TESTS_OUTCOME:-not-run}"
            echo "- Test build: ${BUILD_OUTCOME:-not-run}"
            echo "- Chromium browser regression suite: ${BROWSER_OUTCOME:-not-run}"
            echo
            echo "A successful report requires every step above to have outcome=success."
            echo "This report is tied to the exact commit SHA shown above."
          } > validation-evidence/validation-report.md
          cat validation-evidence/validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and commit-bound report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: path28-validation-evidence-${{ github.sha }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 90
