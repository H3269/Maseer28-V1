name: Validate Path28 content

on:
  pull_request:
    paths:
      - 'public/content/**'
      - 'public/assistant/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/validate-assistant-topics.mjs'
      - 'scripts/audit-course-content-quality.mjs'
      - 'scripts/audit-content-mappings.mjs'
      - 'scripts/generate-content-mapping-queue.mjs'
      - 'public/assistant/mappings/**'
      - 'public/assistant/evidence/**'
      - 'public/assistant/schemas/content-mapping.v1.schema.json'
      - 'tests/contentMappingWorkflow.test.js'
      - 'public/assistant/reviews/**'
      - 'public/assistant/schemas/course-content-quality-review.v1.schema.json'
      - 'tests/courseContentQualityAudit.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'scripts/prepare-production-build.mjs'
  push:
    branches: [main]
    paths:
      - 'public/content/**'
      - 'public/assistant/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/validate-assistant-topics.mjs'
      - 'package.json'
      - '.github/workflows/**'
      - 'scripts/prepare-production-build.mjs'

permissions:
  contents: read

concurrency:
  group: path28-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Dependency security audit
        if: ${{ steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Capture complete npm audit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --json > npm-audit-report.json || true
      - name: Validate assistant topic registry
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:assistant-topics
      - name: Run unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Validate course and library data
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:content
      - name: Audit content-to-topic mappings
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: mkdir -p artifacts && npm run --silent audit:content-mappings > artifacts/content-mapping-audit.json
      - name: Audit course content quality and review readiness
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: mkdir -p artifacts && npm run --silent audit:course-content-quality > artifacts/course-content-quality-audit.json
      - name: Upload structural audit reports
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-structure-audit-reports
          path: |
            artifacts/content-mapping-audit.json
            artifacts/course-content-quality-audit.json
          if-no-files-found: warn
      - name: Build application
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          npm run prepare:production
          npm run build

      - name: Upload npm audit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error
