name: Validate Path28 content

on:
  pull_request:
    paths:
      - 'public/content/**'
      - 'public/assistant/**'
      - 'docs/review-data/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/validate-assistant-topics.mjs'
      - 'scripts/audit-content-quality.mjs'
      - 'scripts/audit-content-mappings.mjs'
      - 'scripts/generate-content-mapping-queue.mjs'
      - 'scripts/audit-course-content-quality.mjs'
      - 'scripts/build-first-pass-review-packet.mjs'
      - 'scripts/audit-content-template-sample.mjs'
      - 'scripts/audit-library-assistant-acceptance.mjs'
      - 'scripts/assert-validation-run.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'scripts/prepare-production-build.mjs'
  push:
    branches: [main, 'content/t*']

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref_name, 'content/t') && format('path28-topic-validation-{0}', github.ref_name) || format('path28-validation-{0}', github.event.pull_request.number || github.sha) }}
  # New commits supersede queued/running PR checks; main integration runs are never auto-cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'content/t') || startsWith(github.head_ref, 'content/t') }}

jobs:
  announce-commit-status:
    name: Announce validation in progress
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish pending status for direct main commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg context "path28/validate-content" \
            --arg description "Path28 validation is running" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:"pending",context:$context,description:$description,target_url:$target_url}' \
          | curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --data-binary @-

  validate-content:
    needs: announce-commit-status
    # The expensive 34-topic / 952-day integration suite is opt-in for PRs.
    # Ordinary package and feature PRs must use their focused validation jobs.
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-validation'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        env:
          # CI validates the browser/WASM path; CUDA provider binaries are not used here.
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Dependency security audit
        if: ${{ steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high

      - name: Validate Cloudflare Worker bundle (dry-run; no deployment)
        if: ${{ steps.install.outcome == 'success' }}
        run: npx --yes wrangler@4.157.0 deploy --dry-run --config workers/assistant-api/wrangler.toml
      - name: Validate non-deploying Cloudflare version upload (dry-run; no upload)
        if: ${{ steps.install.outcome == 'success' }}
        run: npx --yes wrangler@4.157.0 versions upload --dry-run --config workers/assistant-api/wrangler.toml
      - name: Exercise replay marker in local Cloudflare Workers runtime
        if: ${{ steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: node tests/workers/replayMarker.integration.mjs
      - name: Exercise complete assistant bootstrap in local Cloudflare Workers runtime
        if: ${{ steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: node tests/workers/assistantBootstrap.integration.mjs
      - name: Exercise semantic conversation in local Cloudflare Workers runtime
        if: ${{ steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: node tests/workers/semanticConversation.integration.mjs
      - name: Capture complete npm audit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --json > npm-audit-report.json || true
      - name: Validate assistant topic registry
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:assistant-topics
      - name: Validate P0 human review queue
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:p0-review-queue

      - name: Run unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Run 125 library assistant acceptance scenarios (routing and source coverage only)
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run audit:library-assistant
      - name: Upload 125-scenario library assistant acceptance report
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-assistant-acceptance
          path: reports/generated/library-assistant-acceptance.json
          if-no-files-found: error
      - name: Validate course and library data
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:content
      - name: Audit daily content quality and topic specificity
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run audit:content-quality
      - name: Generate complete 952-day content mapping review queue
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run generate:content-mapping-queue
      - name: Audit topic and subtopic content mappings
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run audit:content-mappings
      - name: Audit 952-day content quality and review readiness
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run audit:course-content-quality
      - name: Audit sampled cross-topic content templates
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run audit:content-template-sample
      - name: Prepare first-pass review packet for all 34 topics
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run prepare:first-pass-review
      - name: Build application
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          PATH28_DEPLOY_BASE=/Maseer28/ npm run prepare:production
          npm run build

      - name: Install Chromium for remaining browser regression tests
        id: chromium
        if: ${{ steps.install.outcome == 'success' }}
        run: |
          # Ubuntu package mirrors can briefly fail DNS resolution on hosted runners.
          # Retry the browser + OS dependency install before treating it as a CI failure.
          for attempt in 1 2 3; do
            if npx --yes --package=playwright@1.55.0 playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Chromium dependency installation failed (attempt $attempt/3); retrying after a short delay."
              sleep $((attempt * 15))
            fi
          done
          echo "Chromium installation failed after 3 attempts."
          exit 1

      - name: Start production preview for browser regression tests
        if: ${{ steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-vite.log 2>&1 &
          echo $! > /tmp/path28-vite.pid
          attempt=1
          while [ "$attempt" -le 30 ]; do
            # The first connection can race Vite startup; keep expected retries quiet.
            if curl --silent --fail http://127.0.0.1:4173/Maseer28/ > /dev/null; then
              echo "Production preview is ready on 127.0.0.1:4173"
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          echo "Production preview did not become ready within 30 seconds."
          cat /tmp/path28-vite.log
          exit 1

      - name: Run remaining Chromium app regression scenarios
        if: ${{ steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          PATH28_BASE_URL: http://127.0.0.1:4173/Maseer28/
        run: |
          PLAYWRIGHT_NODE_PATH="$(npx --yes --package=playwright@1.55.0 -c 'dirname "$(dirname "$(command -v playwright)")"')"
          # Disabled by project decision: keep local migration/runtime safeguards and unit coverage intact.
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/archive-export.mjs
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/daily-safety-gate.mjs
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/daily-assistant-guidance.mjs
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/global-assistant-launcher.mjs
          # Invalid legacy-data recovery remains covered by local unit tests; browser suite disabled by project decision.

      - name: Upload generated 952-day mapping review queue
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-mapping-review-queue
          path: public/assistant/mappings/course-content-mappings.v1.json
          if-no-files-found: error
      - name: Upload sampled content template report
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-template-sample-report
          path: artifacts/content-template-sample-report.md
          if-no-files-found: error
      - name: Upload first-pass 34-topic review packet
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-pass-review-34-days
          path: artifacts/first-pass-review-34-days.md
          if-no-files-found: error
      - name: Upload daily content quality audit
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: path28-content-quality-audit
          path: reports/generated/path28-content-quality-audit.json
          if-no-files-found: error

      - name: Upload npm audit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error

# Feature-specific PRs use a bounded test set; never fall through to the full 34-topic suite.
  validate-assistant-safety-ui:
    name: Validate assistant safety UI (T01-T05)
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'fix/assistant-safety-return-contact-') || startsWith(github.head_ref, 'fix/shafa-contact-guidance-') || startsWith(github.head_ref, 'fix/shafa-contact-visible-through-safety-stage-') || startsWith(github.head_ref, 'assistant/daily-safety-footer-')) }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Run focused T01-T06 assistant and safety unit tests
        run: >-
          node --test
          tests/angerDailyAssistantPrompts.test.js
          tests/anxietyDailyAssistantPrompts.test.js
          tests/fearDailyAssistantPrompts.test.js
          tests/hatredDailyAssistantPrompts.test.js
          tests/jealousyDailyAssistantPrompts.test.js
          tests/griefDailyAssistantPrompts.test.js
          tests/preparedOnlyCurrentTopics.test.js
          tests/dailySafety.test.mjs
          tests/assistantMessageFormatting.test.js
          tests/dailyAssistantSafetyReminder.test.js
      - name: Build application
        run: |
          PATH28_DEPLOY_BASE=/Maseer28/ npm run prepare:production
          npm run build
      - name: Verify preinstalled Chromium
        run: npx --yes --package=playwright@1.55.0 playwright --version
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-vite.log 2>&1 &
          echo $! > /tmp/path28-vite.pid
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl --silent --fail http://127.0.0.1:4173/Maseer28/ > /dev/null; then
              echo "Production preview is ready on 127.0.0.1:4173"
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          echo "Production preview did not become ready within 30 seconds."
          cat /tmp/path28-vite.log
          exit 1
      - name: Run focused Chromium safety and assistant regressions
        env:
          PATH28_BASE_URL: http://127.0.0.1:4173/Maseer28/
        run: |
          PLAYWRIGHT_NODE_PATH="$(npx --yes --package=playwright@1.55.0 -c 'dirname "$(dirname "$(command -v playwright)")"')"
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/daily-safety-gate.mjs
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/daily-assistant-guidance.mjs
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/global-assistant-launcher.mjs

# Topic-package PRs are validated in isolation; the full 34-topic suite is reserved for integration.
  validate-topic-package:
    name: Validate only changed topic package tests
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'content/t')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'content/t')) }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - name: Checkout full history for package-scoped diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Select tests changed by this topic package only
        id: package_tests
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD > /tmp/topic-package-files.txt
          mapfile -t unit_tests < <(grep -E '^tests/.+\.test\.(js|mjs)$' /tmp/topic-package-files.txt || true)
          mapfile -t browser_tests < <(grep -E '^tests/browser/.+\.mjs$' /tmp/topic-package-files.txt || true)
          if [ "${#unit_tests[@]}" -eq 0 ]; then
            echo "No package-scoped unit/content/assistant tests were changed; refusing to report a topic package as validated."
            exit 1
          fi
          if [ "${#browser_tests[@]}" -eq 0 ]; then
            echo "No package-scoped Chromium regression test was changed; refusing to report a topic package as validated."
            exit 1
          fi
          printf '%s\\n' "${unit_tests[@]}" > /tmp/topic-unit-tests.txt
          printf '%s\\n' "${browser_tests[@]}" > /tmp/topic-browser-tests.txt
          echo "Selected ${#unit_tests[@]} unit tests and ${#browser_tests[@]} browser tests for this package."
      - name: Run changed topic-package unit and content tests
        run: |
          mapfile -t unit_tests < /tmp/topic-unit-tests.txt
          node --test "${unit_tests[@]}"
      - name: Build application
        run: |
          PATH28_DEPLOY_BASE=/Maseer28/ npm run prepare:production
          npm run build
      - name: Verify preinstalled Chromium
        run: npx --yes --package=playwright@1.55.0 playwright --version
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-vite.log 2>&1 &
          echo $! > /tmp/path28-vite.pid
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl --silent --fail http://127.0.0.1:4173/Maseer28/ > /dev/null; then
              echo "Production preview is ready on 127.0.0.1:4173"
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          echo "Production preview did not become ready within 30 seconds."
          cat /tmp/path28-vite.log
          exit 1
      - name: Run only changed topic-package Chromium regressions
        env:
          PATH28_BASE_URL: http://127.0.0.1:4173/Maseer28/
        run: |
          PLAYWRIGHT_NODE_PATH="$(npx --yes --package=playwright@1.55.0 -c 'dirname "$(dirname "$(command -v playwright)")"')"
          while IFS= read -r browser_test; do
            NODE_PATH="$PLAYWRIGHT_NODE_PATH" node "$browser_test"
          done < /tmp/topic-browser-tests.txt

  report-commit-status:
    name: Report validation result on commit
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [announce-commit-status, validate-content]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish validation result for direct main commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RESULT: ${{ needs.validate-content.result }}
        run: |
          case "$VALIDATION_RESULT" in
            success)
              STATE="success"
              DESCRIPTION="Path28 validation passed"
              ;;
            failure)
              STATE="failure"
              DESCRIPTION="Path28 validation failed"
              ;;
            *)
              STATE="error"
              DESCRIPTION="Path28 validation did not complete successfully"
              ;;
          esac

          jq -n \
            --arg state "$STATE" \
            --arg context "path28/validate-content" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
          | curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --data-binary @-
