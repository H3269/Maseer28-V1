name: Validate Path28 content

on:
  pull_request:
    paths:
      - 'public/content/**'
      - 'public/assistant/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/validate-assistant-topics.mjs'
      - 'scripts/audit-content-quality.mjs'
      - 'scripts/assert-validation-run.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'scripts/prepare-production-build.mjs'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: path28-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Dependency security audit
        if: ${{ steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Capture complete npm audit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm audit --json > npm-audit-report.json || true
      - name: Validate assistant topic registry
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:assistant-topics
      - name: Run unit tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Validate course and library data
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run validate:content
      - name: Audit daily content quality and topic specificity
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run audit:content-quality
      - name: Build application
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          npm run prepare:production
          npm run build

      - name: Install Chromium for browser migration tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx --yes --package=playwright@1.55.0 playwright install --with-deps chromium

      - name: Start production preview for browser migration tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-vite.log 2>&1 &
          echo $! > /tmp/path28-vite.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/path28-vite.log
          exit 1

      - name: Run Chromium privacy migration scenarios
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          PATH28_BASE_URL: http://127.0.0.1:4173
        run: |
          PLAYWRIGHT_NODE_PATH="$(npx --yes --package=playwright@1.55.0 -c 'dirname "$(dirname "$(command -v playwright)")"')"
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/privacy-migration.mjs
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/archive-export.mjs

      - name: Upload daily content quality audit
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: path28-content-quality-audit
          path: reports/generated/path28-content-quality-audit.json
          if-no-files-found: error

      - name: Upload npm audit report
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error
