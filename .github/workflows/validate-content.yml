name: Validate Path28 content

on:
  pull_request:
    paths:
      - 'public/content/**'
      - 'scripts/validate-content.mjs'
      - 'package.json'
      - '.github/workflows/validate-content.yml'
  push:
    branches: [main]
    paths:
      - 'public/content/**'
      - 'scripts/validate-content.mjs'
      - 'package.json'
      - '.github/workflows/validate-content.yml'

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate course and library data
        run: |
          npm run validate:content
