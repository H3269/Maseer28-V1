name: Publish tested Path28 version to Telegram


on:
  workflow_dispatch:
    inputs:
      publish:
        description: "پس از اطمینان از نسخه تست، PUBLISH را انتخاب کن"
        required: true
        type: choice
        options:
          - "false"
          - "publish"
        default: "false"

permissions:
  contents: read

concurrency:
  group: publish-path28-telegram
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ inputs.publish == 'publish' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Refuse publication from non-main refs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"
          echo "Publishing only the exact main commit: ${GITHUB_SHA}"

      - name: Checkout tested version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: test-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test-source/package-lock.json

      # Validate the checked-out main commit directly. Publication has no
      # dependency on a separate validation workflow or its workflow filename.
      - name: Install dependencies and validate release source
        working-directory: test-source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run validate:content
          npm run validate:assistant-topics
          npm test

      - name: Build test version for browser regression
        working-directory: test-source
        run: npm run build -- --base=/Maseer28-V1/

      - name: Prepare canonical reader parity baseline
        working-directory: test-source
        shell: bash
        run: |
          mkdir -p dist/test-fixtures
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const baselineCommit = 'b9f2de1898c5e023e35840b0c86883546a7204d4';
          const source = execFileSync('git', [
            'show',
            `${baselineCommit}:src/features/library/readerEngine.js`,
          ], { encoding: 'utf8' });
          const baseline = source.replaceAll(
            'import.meta.env.BASE_URL',
            JSON.stringify('/Maseer28-V1/'),
          );
          if (baseline.includes('import.meta.env')) {
            throw new Error('Reader baseline contains an unresolved Vite environment reference.');
          }
          if (!baseline.includes('export function buildLegacyReaderLayout')) {
            throw new Error('Historical reader baseline does not expose the expected layout function.');
          }
          writeFileSync('dist/test-fixtures/readerEngine-baseline.js', baseline, 'utf8');
          NODE
          test -s dist/test-fixtures/readerEngine-baseline.js
          node --check dist/test-fixtures/readerEngine-baseline.js

      - name: Install pinned Playwright browser runner
        working-directory: test-source
        run: npm install --no-save --package-lock=false playwright@1.65.1

      - name: Install Chromium headless shell and system dependencies
        working-directory: test-source
        shell: bash
        run: |
          set -euo pipefail
          # Every release browser test launches Chromium in headless mode.
          # Install only the matching headless shell, not the unused full Chrome
          # and FFmpeg downloads.
          npx playwright install-deps chromium
          npx playwright install --only-shell chromium

      - name: Run browser regression against the test build
        working-directory: test-source
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              cat /tmp/path28-preview.log
              exit 1
            fi
            sleep 2
          done
          export PATH28_BASE_URL=http://127.0.0.1:4173/Maseer28-V1/

          # Browser checks are independent: each script creates its own browser
          # and isolated contexts, and all use the same immutable preview build.
          # Run at most three scripts concurrently to shorten wall-clock time
          # without overloading the GitHub-hosted runner.
          mkdir -p /tmp/path28-browser-logs
          browser_test_status=0
          if printf '%s\0' tests/browser/*.mjs | xargs -0 -P 3 -I '{}' bash -c '
            script="$1"
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            {
              echo "Running $script"
              node "$script"
            } > "$log_file" 2>&1
          ' _ '{}'; then
            browser_test_status=0
          else
            browser_test_status=$?
          fi

          # Print every log even when a test fails, then fail the release gate.
          for script in tests/browser/*.mjs; do
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            echo "===== $script ====="
            if [ -f "$log_file" ]; then
              cat "$log_file"
            else
              echo "No log was produced for $script."
              browser_test_status=1
            fi
          done
          exit "$browser_test_status"

      - name: Prepare production-only copy
        working-directory: test-source
        run: npm run prepare:production

      - name: Build production version
        working-directory: test-source
        run: npm run build

      - name: Checkout Telegram repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: H3269/Maseer28
          ref: main
          token: ${{ secrets.TELEGRAM_REPO_TOKEN }}
          persist-credentials: true
          path: telegram-site

      - name: Fix destination Pages artifact naming
        working-directory: telegram-site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/deploy.yml")
          if not workflow.is_file():
              raise SystemExit("Telegram repository Pages deployment workflow is missing.")

          content = workflow.read_text(encoding="utf-8")
          if "  actions: read\n" not in content:
              if "  contents: read\n  pages: write\n" not in content:
                  raise SystemExit("Unexpected deploy.yml permissions; refusing an unsafe automatic edit.")
              content = content.replace(
                  "  contents: read\n  pages: write\n",
                  "  contents: read\n  actions: read\n  pages: write\n",
                  1,
              )
          old_upload = """      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          """
          new_upload = """      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-__GH_EXPR_RUN_ID__-__GH_EXPR_RUN_ATTEMPT__
          """
          old_deploy = """      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
          """
          new_deploy = """      - name: Wait for Pages artifact to become available
        id: wait-pages-artifact
        env:
          GH_TOKEN: __GH_EXPR_GITHUB_TOKEN__
          RUN_ID: __GH_EXPR_RUN_ID__
          RUN_ATTEMPT: __GH_EXPR_RUN_ATTEMPT__
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" | jq -r --arg expected "github-pages-${RUN_ID}-${RUN_ATTEMPT}" '.artifacts | map(select(.expired == false and .name == $expected)) | first | .name // empty')"
            if [ -n "$artifact_name" ]; then
              echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "Found Pages artifact for this attempt: $artifact_name"
              exit 0
            fi
            echo "Pages artifact is not indexed yet (attempt $attempt/24); waiting 5 seconds."
            sleep 5
          done

          # A deploy-only retry does not rerun the upload step. Reuse the newest
          # non-expired artifact from an earlier attempt of this same run only
          # after waiting for the current attempt's artifact.
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" | jq -r --arg prefix "github-pages-${RUN_ID}-" --arg current "github-pages-${RUN_ID}-${RUN_ATTEMPT}" '.artifacts | map(select(.expired == false and (.name | startswith($prefix)) and .name != $current)) | sort_by(.created_at) | last | .name // empty')"
            if [ -n "$artifact_name" ]; then
              echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "Reusing prior-attempt Pages artifact: $artifact_name"
              exit 0
            fi
          fi

          echo "No Pages artifact for this workflow run became available."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: __GH_EXPR_WAIT_OUTPUT__
          """

          new_upload = new_upload.replace("__GH_EXPR_RUN_ID__", "$" + "{{ github.run_id }}").replace("__GH_EXPR_RUN_ATTEMPT__", "$" + "{{ github.run_attempt }}")
          new_deploy = new_deploy.replace("__GH_EXPR_GITHUB_TOKEN__", "$" + "{{ github.token }}").replace("__GH_EXPR_RUN_ID__", "$" + "{{ github.run_id }}").replace("__GH_EXPR_RUN_ATTEMPT__", "$" + "{{ github.run_attempt }}").replace("__GH_EXPR_WAIT_OUTPUT__", "$" + "{{ steps.wait-pages-artifact.outputs.artifact_name }}")

          if new_upload.strip() in content and new_deploy.strip() in content:
              print("Pages artifact naming is already retry-safe.")
          else:
              if old_upload.strip() not in content or old_deploy.strip() not in content:
                  raise SystemExit("Unexpected deploy.yml structure; refusing an unsafe automatic edit.")
              content = content.replace(old_upload.strip(), new_upload.strip(), 1)
              content = content.replace(old_deploy.strip(), new_deploy.strip(), 1)
              workflow.write_text(content, encoding="utf-8")
          PY

      - name: Prepare version and publication date
        shell: bash
        run: |
          set -euo pipefail
          node test-source/scripts/write-release-metadata.mjs \
            test-source/package.json \
            telegram-site/version.json \
            test-source/dist/version.json

      - name: Verify build output allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dist = Path("test-source/dist")
          allowed = {"assets", "content", "assistant", "index.html", "manifest.webmanifest", "Label.png", "version.json"}
          required = {"assets", "content", "assistant", "index.html", "manifest.webmanifest", "Label.png", "version.json"}
          if not dist.is_dir():
              raise SystemExit("Build output directory is missing.")
          actual = {item.name for item in dist.iterdir()}
          unexpected = actual - allowed
          missing = required - actual
          if unexpected:
              raise SystemExit(f"Unexpected build output entries: {sorted(unexpected)}")
          if missing:
              raise SystemExit(f"Required build output entries missing: {sorted(missing)}")
          for name in ("assets", "content", "assistant"):
              if not (dist / name).is_dir():
                  raise SystemExit(f"Expected build directory missing: {name}")
          for name in ("index.html", "manifest.webmanifest", "Label.png", "version.json"):
              if not (dist / name).is_file() or (dist / name).stat().st_size == 0:
                  raise SystemExit(f"Required build file missing or empty: {name}")
          PY

      - name: Prepare Telegram app files
        shell: bash
        run: |
          set -euo pipefail
          for directory in assets content assistant; do
            mkdir -p "telegram-site/$directory"
            rsync -a --delete "test-source/dist/$directory/" "telegram-site/$directory/"
          done
          install -m 0644 test-source/dist/index.html telegram-site/index.html
          install -m 0644 test-source/dist/manifest.webmanifest telegram-site/manifest.webmanifest
          install -m 0644 test-source/dist/Label.png telegram-site/Label.png
          install -m 0644 test-source/dist/version.json telegram-site/version.json
          test -s telegram-site/index.html
          test -s telegram-site/version.json

      - name: Commit and push Telegram version
        id: publish
        working-directory: telegram-site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html manifest.webmanifest Label.png assets content assistant version.json .github/workflows/deploy.yml
          if git diff --cached --quiet; then
            echo "Release metadata did not produce a change; refusing to report a publication."
            exit 1
          fi
          git commit -m "Publish Path28 version with daily lock enabled"
          git push origin HEAD:main

          # Confirm the destination main branch points to the exact commit
          # that this job pushed; do not report success on a local-only commit.
          expected_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "$expected_sha" ]; then
            echo "Telegram main verification failed: expected $expected_sha, found ${remote_sha:-empty}."
            exit 1
          fi

          echo "published_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Confirm Telegram publication
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLISHED_SHA"
          echo "Telegram repository main was updated successfully."
          echo "Published commit: $PUBLISHED_SHA"
          {
            echo "## Telegram publication succeeded"
            echo
            echo "- Destination: H3269/Maseer28 (main)"
            echo "- Published commit: $PUBLISHED_SHA"
            echo "- The destination Pages workflow receives the artifact-indexing wait and deploy-only retries authored in this V1 workflow."
          } >> "$GITHUB_STEP_SUMMARY"
