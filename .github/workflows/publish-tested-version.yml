name: Publish tested Path28 version to Telegram


on:
  workflow_dispatch:
    inputs:
      publish:
        description: "پس از اطمینان از نسخه تست، PUBLISH را انتخاب کن"
        required: true
        type: choice
        options:
          - "false"
          - "publish"
        default: "false"

permissions:
  contents: read

concurrency:
  group: publish-path28-telegram
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ inputs.publish == 'publish' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Refuse publication from non-main refs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"
          echo "Publishing only the exact main commit: ${GITHUB_SHA}"

      - name: Checkout tested version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: test-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test-source/package-lock.json

      # Validate the checked-out main commit directly. Publication has no
      # dependency on a separate validation workflow or its workflow filename.
      - name: Install dependencies and validate release source
        working-directory: test-source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run validate:content
          npm run validate:assistant-topics
          npm test

      - name: Build test version for browser regression
        working-directory: test-source
        run: npm run build -- --base=/Maseer28-V1/

      - name: Prepare canonical reader parity baseline
        working-directory: test-source
        shell: bash
        run: |
          mkdir -p dist/test-fixtures
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const baselineCommit = 'b9f2de1898c5e023e35840b0c86883546a7204d4';
          const source = execFileSync('git', [
            'show',
            `${baselineCommit}:src/features/library/readerEngine.js`,
          ], { encoding: 'utf8' });
          const baseline = source.replaceAll(
            'import.meta.env.BASE_URL',
            JSON.stringify('/Maseer28-V1/'),
          );
          if (baseline.includes('import.meta.env')) {
            throw new Error('Reader baseline contains an unresolved Vite environment reference.');
          }
          if (!baseline.includes('export function buildLegacyReaderLayout')) {
            throw new Error('Historical reader baseline does not expose the expected layout function.');
          }
          writeFileSync('dist/test-fixtures/readerEngine-baseline.js', baseline, 'utf8');
          NODE
          test -s dist/test-fixtures/readerEngine-baseline.js
          node --check dist/test-fixtures/readerEngine-baseline.js

      - name: Install pinned Playwright browser runner
        working-directory: test-source
        run: npm install --no-save --package-lock=false playwright@1.65.1

      - name: Install Chromium headless shell and system dependencies
        working-directory: test-source
        shell: bash
        run: |
          set -euo pipefail
          # Every release browser test launches Chromium in headless mode.
          # Install only the matching headless shell, not the unused full Chrome
          # and FFmpeg downloads.
          npx playwright install-deps chromium
          npx playwright install --only-shell chromium

      - name: Run browser regression against the test build
        working-directory: test-source
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              cat /tmp/path28-preview.log
              exit 1
            fi
            sleep 2
          done
          export PATH28_BASE_URL=http://127.0.0.1:4173/Maseer28-V1/

          # Browser checks are independent: each script creates its own browser
          # and isolated contexts, and all use the same immutable preview build.
          # Run at most three scripts concurrently to shorten wall-clock time
          # without overloading the GitHub-hosted runner.
          mkdir -p /tmp/path28-browser-logs
          browser_test_status=0
          if printf '%s\0' tests/browser/*.mjs | xargs -0 -P 3 -I '{}' bash -c '
            script="$1"
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            {
              echo "Running $script"
              node "$script"
            } > "$log_file" 2>&1
          ' _ '{}'; then
            browser_test_status=0
          else
            browser_test_status=$?
          fi

          # Print every log even when a test fails, then fail the release gate.
          for script in tests/browser/*.mjs; do
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            echo "===== $script ====="
            if [ -f "$log_file" ]; then
              cat "$log_file"
            else
              echo "No log was produced for $script."
              browser_test_status=1
            fi
          done
          exit "$browser_test_status"

      - name: Prepare production-only copy
        working-directory: test-source
        run: npm run prepare:production

      - name: Build production version
        working-directory: test-source
        run: npm run build

      - name: Checkout Telegram repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: H3269/Maseer28
          ref: main
          token: ${{ secrets.TELEGRAM_REPO_TOKEN }}
          persist-credentials: true
          path: telegram-site

      - name: Prepare version and publication date
        shell: bash
        run: |
          set -euo pipefail
          node test-source/scripts/write-release-metadata.mjs \
            test-source/package.json \
            telegram-site/version.json \
            test-source/dist/version.json

      - name: Verify build output allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dist = Path("test-source/dist")
          allowed = {"assets", "content", "assistant", "index.html", "manifest.webmanifest", "Label.png", "version.json"}
          required = {"assets", "content", "assistant", "index.html", "manifest.webmanifest", "Label.png", "version.json"}
          if not dist.is_dir():
              raise SystemExit("Build output directory is missing.")
          actual = {item.name for item in dist.iterdir()}
          unexpected = actual - allowed
          missing = required - actual
          if unexpected:
              raise SystemExit(f"Unexpected build output entries: {sorted(unexpected)}")
          if missing:
              raise SystemExit(f"Required build output entries missing: {sorted(missing)}")
          for name in ("assets", "content", "assistant"):
              if not (dist / name).is_dir():
                  raise SystemExit(f"Expected build directory missing: {name}")
          for name in ("index.html", "manifest.webmanifest", "Label.png", "version.json"):
              if not (dist / name).is_file() or (dist / name).stat().st_size == 0:
                  raise SystemExit(f"Required build file missing or empty: {name}")
          PY

      - name: Publish only application-owned paths
        shell: bash
        run: |
          set -euo pipefail
          for directory in assets content assistant; do
            mkdir -p "telegram-site/$directory"
            rsync -a --delete "test-source/dist/$directory/" "telegram-site/$directory/"
          done
          install -m 0644 test-source/dist/index.html telegram-site/index.html
          install -m 0644 test-source/dist/manifest.webmanifest telegram-site/manifest.webmanifest
          install -m 0644 test-source/dist/Label.png telegram-site/Label.png
          install -m 0644 test-source/dist/version.json telegram-site/version.json
          test -s telegram-site/index.html
          test -s telegram-site/.github/workflows/deploy.yml
          test -s telegram-site/production/README-FA.md
          test -s telegram-site/README-FA.md

      - name: Commit and push Telegram version
        id: publish
        working-directory: telegram-site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html manifest.webmanifest Label.png assets content assistant version.json
          if git diff --cached --quiet; then
            echo "Release metadata did not produce a change; refusing to report a publication."
            exit 1
          fi
          git commit -m "Publish Path28 version with daily lock enabled"
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The destination Pages workflow is started by the push above. GitHub can
      # briefly report no Pages artifact immediately after a successful upload.
      # Track only the run for this exact destination commit and retry its failed
      # deploy job (never repeat the application publication push).
      - name: Verify and recover Telegram Pages deployment
        env:
          GH_TOKEN: ${{ secrets.TELEGRAM_REPO_TOKEN }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const owner = 'H3269';
          const repo = 'Maseer28';
          const base = `https://api.github.com/repos/${owner}/${repo}`;
          const token = process.env.GH_TOKEN;
          const publishedSha = process.env.PUBLISHED_SHA;
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          if (!token || !publishedSha) throw new Error('Missing destination token or published commit SHA.');

          async function api(path, method = 'GET') {
            const response = await fetch(`${base}${path}`, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            const body = await response.text();
            if (!response.ok) {
              const error = new Error(`GitHub API ${method} ${path} returned ${response.status}: ${body.slice(0, 500)}`);
              error.status = response.status;
              throw error;
            }
            return body ? JSON.parse(body) : {};
          }

          function report(markdown) {
            appendFileSync(summaryFile, `${markdown}\n`);
            console.log(markdown.replaceAll(/[*`]/g, ''));
          }

          async function findPagesRun() {
            const data = await api('/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=30');
            return data.workflow_runs.find((run) => run.head_sha === publishedSha) ?? null;
          }

          async function waitForRun(timeoutMs, minAttempt = 0, runId = null) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const run = runId
                ? await api(`/actions/runs/${runId}`)
                : await findPagesRun();
              if (run && run.run_attempt > minAttempt && run.status === 'completed') return run;
              if (run && run.run_attempt > minAttempt && run.status !== 'completed') {
                await sleep(10000);
                continue;
              }
              await sleep(5000);
            }
            return null;
          }

          async function isArtifactVisibilityRace(runId) {
            const data = await api(`/actions/runs/${runId}/jobs?filter=latest&per_page=50`);
            const deployJob = data.jobs.find((job) => job.name.toLowerCase() === 'deploy');
            if (!deployJob || deployJob.conclusion !== 'failure') return false;
            const upload = deployJob.steps?.find((step) => step.name === 'Upload artifact');
            const deploy = deployJob.steps?.find((step) => step.name === 'Deploy');
            return upload?.conclusion === 'success' && deploy?.conclusion === 'failure';
          }

          try {
            let run = await waitForRun(180000);
            if (!run) {
              report('### GitHub Pages: وضعیت نامشخص\nاجرای Pages برای commit منتشرشده در مهلت ۳ دقیقه‌ای پیدا نشد؛ انتشار فایل‌ها در مخزن مقصد انجام شده است، اما Deploy هنوز تأیید نشده است.');
            } else if (run.conclusion === 'success') {
              report(`### GitHub Pages: موفق\nاجرای Pages برای commit \`${publishedSha}\` با موفقیت تمام شد.`);
            } else {
              let recovered = false;
              for (let retry = 1; retry <= 3; retry += 1) {
                if (!(await isArtifactVisibilityRace(run.id))) break;
                const delayMs = [10000, 20000, 40000][retry - 1];
                console.log(`Pages artifact visibility race detected; waiting ${delayMs / 1000}s before deploy-job retry ${retry}/3.`);
                await sleep(delayMs);
                const previousAttempt = run.run_attempt;
                await api(`/actions/runs/${run.id}/rerun-failed-jobs`, 'POST');
                run = await waitForRun(480000, previousAttempt, run.id);
                if (!run) break;
                if (run.conclusion === 'success') {
                  recovered = true;
                  break;
                }
              }
              if (recovered) {
                report(`### GitHub Pages: بازیابی شد\nخطای موقت Artifact با تلاش مجدد Deploy برطرف شد. commit: \`${publishedSha}\`.`);
              } else {
                report(`### هشدار GitHub Pages\nانتقال نسخه به مخزن مقصد انجام شده، اما Deploy پس از بررسی و حداکثر ۳ تلاش مجدد تأیید نشد. اجرای Pages را بررسی کن: https://github.com/${owner}/${repo}/actions/workflows/deploy.yml\ncommit: \`${publishedSha}\`.`);
              }
            }
          } catch (error) {
            const reason = error.status === 403 || error.status === 404
              ? 'توکن TELEGRAM_REPO_TOKEN مجوز مشاهده/تلاش مجدد اجرای GitHub Actions در مخزن مقصد را ندارد.'
              : 'ارتباط با API گیت‌هاب یا بررسی اجرای Pages ناموفق بود.';
            report(`### هشدار بررسی GitHub Pages\n${reason} انتشار فایل‌ها قبلاً انجام شده است؛ وضعیت Deploy را جداگانه بررسی کن. جزئیات: ${String(error.message).slice(0, 300)}`);
          }
          NODE

      - name: Confirm Telegram publication
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLISHED_SHA"
          echo "Telegram repository main was updated successfully."
          echo "Published commit: $PUBLISHED_SHA"
          {
            echo "## Telegram publication succeeded"
            echo
            echo "- Destination: H3269/Maseer28 (main)"
            echo "- Published commit: $PUBLISHED_SHA"
            echo "- GitHub Pages deployment runs independently in the destination repository and does not determine this publication workflow result."
          } >> "$GITHUB_STEP_SUMMARY"
