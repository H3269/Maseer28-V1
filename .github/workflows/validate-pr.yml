name: Validate assistant and content changes

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/content/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-pr.yml"

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate content
        run: npm run validate:content

      - name: Validate assistant topic registry
        run: npm run validate:assistant-topics

      - name: Audit content quality
        run: npm run audit:content-quality

      - name: Build test app
        run: npm run build -- --base=/Maseer28-V1/
