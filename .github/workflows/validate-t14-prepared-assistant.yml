name: Validate T14 prepared assistant in Chromium

on:
  pull_request:
    paths:
      - 'src/features/assistant/GlobalAssistantLauncher.jsx'
      - 'src/features/assistant/t14DailyAssistantPrompts.js'
      - 'src/features/assistant/t14DailyAssistantGuide.v1.json'
      - 'src/features/assistant/pageAssistantTurn.js'
      - 'tests/browser/t14-prepared-assistant.mjs'
      - '.github/workflows/validate-t14-prepared-assistant.yml'

permissions:
  contents: read

concurrency:
  group: t14-prepared-assistant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  t14-prepared-assistant:
    name: Verify visible T14 prepared questions and day answer
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Dependency security audit
        if: ${{ steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Build application
        id: build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          PATH28_DEPLOY_BASE=/Maseer28/ npm run prepare:production
          npm run build
      - name: Start production preview
        id: preview
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/t14-vite.log 2>&1 &
          echo $! > /tmp/t14-vite.pid
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl --silent --fail http://127.0.0.1:4173/Maseer28/ > /dev/null; then
              echo "T14 production preview is ready."
              exit 0
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          cat /tmp/t14-vite.log
          exit 1
      - name: Verify T14 prepared questions and day-specific answer in Chromium
        if: ${{ always() && steps.preview.outcome == 'success' }}
        env:
          PATH28_BASE_URL: http://127.0.0.1:4173/Maseer28/
        run: |
          PLAYWRIGHT_NODE_PATH="$(npx --yes --package=playwright@1.55.0 -c 'dirname "$(dirname "$(command -v playwright)")"')"
          NODE_PATH="$PLAYWRIGHT_NODE_PATH" node tests/browser/t14-prepared-assistant.mjs
