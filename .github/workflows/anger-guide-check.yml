name: Anger guide rebuilt assistant checks

on:
  push:
    branches: [rebuild/anger-guide-28-days, fix/anger-sample-three-isolation, refactor/shared-daily-assistant-engine-t02-t14]
  pull_request:
    branches: [main]
    paths:
      - "src/features/assistant/angerDailyAssistantPrompts.js"
      - "src/features/assistant/angerDailyRebuiltAnswerBank.js"
      - "src/features/assistant/sharedDailyAssistantEngine.js"
      - "src/features/assistant/pageAssistantTurn.js"
      - "src/features/assistant/dailyExerciseAssistantGuidance.js"
      - "src/features/assistant/GlobalAssistantLauncher.jsx"
      - "src/features/assistant/anxietyDailyAssistantPrompts.js"
      - "tests/angerDailyAssistantPrompts.test.js"
      - "tests/sharedDailyAssistantEngine.test.js"
      - "tests/pageAssistantTurn.test.js"
      - "tests/angerDailyPreparedAnswers.test.js"
      - "tests/anxietyDailyAssistantPrompts.test.js"
      - "tests/sharedDailyAssistantAnswerFrame.test.js"
      - "tests/dailyAssistantCrossTopicContract.test.js"
      - "tests/dailyAssistantSafetyReminder.test.js"
      - "tests/assistantMessageFormatting.test.js"
      - "tests/browser/daily-assistant-guidance.mjs"
      - "public/content/daily-text-overrides.v1.json"
      - "package.json"
      - "package-lock.json"

jobs:
  anger-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run complete automated test suite
        run: npm test
      - name: Run focused assistant regression tests
        run: >-
          node --test
          tests/angerDailyAssistantPrompts.test.js
          tests/angerDailyPreparedAnswers.test.js
          tests/dailyAssistantCrossTopicContract.test.js
          tests/dailyAssistantSafetyReminder.test.js
          tests/assistantMessageFormatting.test.js
          tests/angerContentPackage.test.mjs
          tests/anxietyDailyAssistantPrompts.test.js
          tests/sharedDailyAssistantAnswerFrame.test.js
      - name: Verify production bundle
        run: npm run build
