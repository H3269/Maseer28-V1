name: Refresh dependency lockfile (temporary)

on:
  push:
    branches:
      - planning/assistant-foundation-v1
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: refresh-lockfile-foundation
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: ${{ github.ref == 'refs/heads/planning/assistant-foundation-v1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: planning/assistant-foundation-v1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git diff --cached --name-only | grep -Fx 'package-lock.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:planning/assistant-foundation-v1
