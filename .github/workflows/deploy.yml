name: Build and Deploy Maseer28-V1 Test App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy-test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately build with the repository's test defaults:
      # TEST_MODE=true and TIME_LOCK_ENABLED=false.
      # Do not run prepare:production or the expert-approved production-content gate here.
      - name: Build test app
        run: npm run build -- --base=/Maseer28-V1/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload test app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./dist

      - name: Deploy test app
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
