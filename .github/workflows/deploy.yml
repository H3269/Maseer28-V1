name: Build and Deploy Maseer28-V1 Test App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy-test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run content, assistant-contract, and regression checks before publishing the test app.
      - name: Run automated tests
        run: npm test

      - name: Validate content data
        run: npm run validate:content

      - name: Validate assistant topic registry
        run: npm run validate:assistant-topics

      - name: Audit content quality
        run: npm run audit:content-quality

      # Deliberately build with the repository's test defaults:
      # TEST_MODE=true and TIME_LOCK_ENABLED=false.
      # Keep this workflow test-only: do not run production preparation or release-only gates here.
      - name: Build test app
        run: npm run build -- --base=/Maseer28-V1/

      # Run the complete Chromium browser regression suite against the same test build.
      - name: Install pinned Playwright browser runner
        run: npm install --no-save --package-lock=false playwright@1.65.1

      - name: Install Chromium headless shell and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install-deps chromium
          npx playwright install --only-shell chromium

      - name: Run browser regression against the test build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              cat /tmp/path28-preview.log
              exit 1
            fi
            sleep 2
          done
          export PATH28_BASE_URL=http://127.0.0.1:4173/Maseer28-V1/
          mkdir -p /tmp/path28-browser-logs
          browser_test_status=0
          if printf '%s\0' tests/browser/*.mjs | xargs -0 -P 3 -I '{}' bash -c '
            script="$1"
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            {
              echo "Running $script"
              node "$script"
            } > "$log_file" 2>&1
          ' _ '{}'; then
            browser_test_status=0
          else
            browser_test_status=$?
          fi
          for script in tests/browser/*.mjs; do
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            echo "===== $script ====="
            if [ -f "$log_file" ]; then
              cat "$log_file"
            else
              echo "No log was produced for $script."
              browser_test_status=1
            fi
          done
          exit "$browser_test_status"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload test app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy test app
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          timeout: 1800000
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
