name: Build and Deploy Maseer28-V1 Test App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy-test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run content, assistant-contract, and regression checks before publishing the test app.
      - name: Run automated tests
        run: npm test

      - name: Validate content data
        run: npm run validate:content

      - name: Validate assistant topic registry
        run: npm run validate:assistant-topics

      - name: Audit content quality
        run: npm run audit:content-quality

      # Deliberately build with the repository's test defaults:
      # TEST_MODE=true and TIME_LOCK_ENABLED=false.
      # Keep this workflow test-only: do not run production preparation or release-only gates here.
      - name: Build test app
        run: npm run build -- --base=/Maseer28-V1/

      - name: Prepare canonical reader parity baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/test-fixtures
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const baselineCommit = 'b9f2de1898c5e023e35840b0c86883546a7204d4';
          const source = execFileSync('git', [
            'show',
            `${baselineCommit}:src/features/library/readerEngine.js`,
          ], { encoding: 'utf8' });
          const baseline = source.replaceAll(
            'import.meta.env.BASE_URL',
            JSON.stringify('/Maseer28-V1/'),
          );
          if (baseline.includes('import.meta.env')) {
            throw new Error('Reader baseline contains an unresolved Vite environment reference.');
          }
          if (!baseline.includes('export function buildLegacyReaderLayout')) {
            throw new Error('Historical reader baseline does not expose the expected layout function.');
          }
          writeFileSync('dist/test-fixtures/readerEngine-baseline.js', baseline, 'utf8');
          NODE
          test -s dist/test-fixtures/readerEngine-baseline.js
          node --check dist/test-fixtures/readerEngine-baseline.js

      # Select browser coverage from changed paths. Source/build changes keep the full suite;
      # test-only changes run only changed browser specs (unit tests still run above).
      - name: Select browser regression scope
        id: browser_scope
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          selected=()
          before="${{ github.event.before }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "$before" =~ ^[0-9a-f]{40}$ && "$before" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
            source_changed=false
            for file in "${changed[@]}"; do
              case "$file" in
                tests/*|.github/workflows/deploy.yml) ;;
                *) source_changed=true ;;
              esac
            done
            if [[ "$source_changed" == false ]]; then
              mode=focused
              for file in "${changed[@]}"; do
                [[ "$file" == tests/browser/*.mjs ]] && selected+=("$file")
              done
            fi
          fi
          if [[ "$mode" == full ]]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [[ "${#selected[@]}" -gt 0 ]]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            echo "mode=focused" >> "$GITHUB_OUTPUT"
            {
              echo "scripts<<EOF"
              printf '%s\n' "${selected[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "run_browser=false" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi
          echo "Browser regression mode: $mode"
          printf 'Selected: %s\n' "${selected[@]:-none}"

      # Test-only pushes run changed browser specs; application/source changes run all specs.
      - name: Install pinned Playwright browser runner
        if: steps.browser_scope.outputs.run_browser == 'true'
        run: npm install --no-save --package-lock=false playwright@1.65.1

      - name: Install Chromium headless shell and system dependencies
        if: steps.browser_scope.outputs.run_browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install-deps chromium
          npx playwright install --only-shell chromium

      - name: Run browser regression against the test build
        if: steps.browser_scope.outputs.run_browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/path28-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              cat /tmp/path28-preview.log
              exit 1
            fi
            sleep 2
          done
          export PATH28_BASE_URL=http://127.0.0.1:4173/Maseer28-V1/
          mkdir -p /tmp/path28-browser-logs
          browser_test_status=0
          if [[ "${{ steps.browser_scope.outputs.mode }}" == "full" ]]; then
            mapfile -t browser_scripts < <(printf '%s\n' tests/browser/*.mjs)
          else
            mapfile -t browser_scripts <<'EOF'
${{ steps.browser_scope.outputs.scripts }}
EOF
          fi
          printf '%s\0' "${browser_scripts[@]}" | xargs -0 -P 3 -I '{}' bash -c '
            script="$1"
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            {
              echo "Running $script"
              node "$script"
            } > "$log_file" 2>&1
          ' _ '{}' || browser_test_status=$?
          for script in "${browser_scripts[@]}"; do
            log_file="/tmp/path28-browser-logs/$(basename "$script").log"
            echo "===== $script ====="
            if [ -f "$log_file" ]; then
              cat "$log_file"
            else
              echo "No log was produced for $script."
              browser_test_status=1
            fi
          done
          exit "$browser_test_status"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload test app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy test app
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          timeout: 1800000
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
