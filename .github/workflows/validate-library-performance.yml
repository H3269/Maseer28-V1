name: Validate library cover performance

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/covers/**'
      - 'public/content/library.seed.json'
      - 'src/features/library/**'
      - 'scripts/prepare-library-cover-thumbnails.mjs'
      - 'tests/startupPerformance.test.mjs'
      - 'tests/libraryBookContentIntegrity.test.js'
      - 'tests/browser/reader-reopen-five-books.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-library-performance.yml'

permissions:
  contents: read

concurrency:
  group: library-cover-performance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-library-performance:
    name: Build, test, and package five library covers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run complete automated test suite
        run: npm test

      - name: Build production application and generate cover thumbnails
        run: |
          PATH28_DEPLOY_BASE=/Maseer28-V1/ npm run build

      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Verify repeated open and close for all five Reader books
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/m28-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/Maseer28-V1/ > /dev/null
          PATH28_BASE_URL=http://127.0.0.1:4173/Maseer28-V1/ node tests/browser/reader-reopen-five-books.mjs

      - name: Upload original and generated library covers for visual QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-cover-visual-qa
          path: |
            public/assets/covers/book*.webp
            public/assets/covers/library/*.webp
          if-no-files-found: error

      # Keep the security gate blocking, but run functional validation first so
      # an advisory with no patched release cannot suppress reader regression tests.
      - name: Dependency security audit
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        id: security-audit
        run: npm audit --audit-level=high
