name: Validate page-specific assistant guides

on:
  pull_request:
    paths:
      - 'src/features/assistant/GlobalAssistantLauncher.jsx'
      - 'src/features/assistant/pageAssistantTurn.js'
      - 'src/features/assistant/pageAssistantPrompts.js'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'src/styles/soft-motion.css'
      - 'tests/softMotionIsolation.test.js'
      - 'tests/assistantReleaseGate.test.js'
      - 'tests/startupPerformance.test.mjs'
      - 'tests/pageAssistantPrompts.test.js'
      - 'src/features/assistant/t14DailyAssistantPrompts.js'
      - 'src/features/assistant/t14DailyAssistantGuide.v1.json'
      - 'src/features/assistant/t15DailyAssistantPrompts.js'
      - 'src/features/assistant/t15DailyAssistantGuide.v1.json'
      - 'tests/t15DailyAssistantPrompts.test.mjs'
      - 'tests/t14DailyAssistantPrompts.test.mjs'
      - '.github/workflows/validate-page-assistant-guides.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-assistant-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test page-specific assistant guides and protected pages
        run: node --test tests/pageAssistantPrompts.test.js tests/pageAssistantContext.test.js tests/assistantReleaseGate.test.js tests/startupPerformance.test.mjs tests/softMotionIsolation.test.js tests/t14DailyAssistantPrompts.test.mjs tests/t15DailyAssistantPrompts.test.mjs tests/dailyAssistantCrossTopicContract.test.js tests/dailyTextOverrides.test.js
      - name: Build application
        run: npm run build
