name: Dashboard isolated validation

on:
  pull_request:
    paths:
      - 'src/features/journey/JourneyScreens.jsx'
      - 'src/styles/iranian-turquoise-preview.css'
      - '.github/workflows/dashboard-isolated-validation.yml'

permissions:
  contents: read

concurrency:
  group: dashboard-isolated-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dashboard-validation:
    name: Dashboard build and regression tests (security audit remains separate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Run repository unit and regression tests
        run: npm test
      - name: Build application
        run: npm run build
